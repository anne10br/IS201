<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anne's Website</title>
<style>





  body {
    margin: 0;
    font-family: var(--bs-body-font-family);
    background: #f4f4f4;
  }

  h1 {
    margin-top: 20px;
  }

  canvas {
    background: #222;
    margin-top: 10px;
    border: 10px solid #335b43;
  }

  #score {
    margin-top: 10px;
    font-size: 20px;
  }

  #message {
    margin-top: 10px;
    font-size: 22px;
    font-weight: bold;
  }

  button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 16px;
    display: none;
    cursor: pointer;
  }
</style>
</head>
<link rel="stylesheet" href="css/aistyles.css">
<body>

<div class="navbar">
    <div class="logo">Custom Game</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="fromscratch.html">Hobbies</a>
      <a href="ai.html">Custom Game</a>
    </div>
  </div>

  <div class="content">
<h1>Snake Game</h1>
<canvas id="game" width="400" height="400"></canvas>
<div id="score">Score: 0</div>
<div id="message"></div>
<button id="restart">Play Again</button>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;

let snake, dx, dy, apple, score, gameOver;

// Initialize / Reset Game
function initGame() {
  snake = [{ x: 200, y: 200 }];
  dx = grid;
  dy = 0;
  apple = randomPosition();
  score = 0;
  gameOver = false;

  document.getElementById("score").textContent = "Score: 0";
  document.getElementById("message").textContent = "";
  document.getElementById("restart").style.display = "none";

  draw();
}

function randomPosition() {
  return {
    x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
    y: Math.floor(Math.random() * (canvas.height / grid)) * grid
  };
}

function draw() {
  if (gameOver) return;

  setTimeout(() => {
    requestAnimationFrame(draw);
  }, 120);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  // Wall collision
  if (
    head.x < 0 || head.y < 0 ||
    head.x >= canvas.width || head.y >= canvas.height
  ) {
    endGame("Game Over! You hit the wall.");
    return;
  }

  // Self collision
  for (let part of snake) {
    if (head.x === part.x && head.y === part.y) {
      endGame("Game Over! You hit yourself.");
      return;
    }
  }

  snake.unshift(head);

  // Apple collision
  if (head.x === apple.x && head.y === apple.y) {
    score++;
    document.getElementById("score").textContent = "Score: " + score;
    apple = randomPosition();

    if (score === 5) {
      endGame("🎉 You Win!");
      return;
    }
  } else {
    snake.pop();
  }

  // Draw apple
  ctx.fillStyle = "red";
  ctx.fillRect(apple.x, apple.y, grid - 2, grid - 2);

  // Draw snake
  ctx.fillStyle = "lime";
  snake.forEach(part => {
    ctx.fillRect(part.x, part.y, grid - 2, grid - 2);
  });
}

function endGame(message) {
  gameOver = true;
  document.getElementById("message").textContent = message;
  document.getElementById("restart").style.display = "block";
}

// Controls
document.addEventListener("keydown", e => {
  if (gameOver) return;

  if (e.key === "ArrowUp" && dy === 0) {
    dx = 0; dy = -grid;
  } else if (e.key === "ArrowDown" && dy === 0) {
    dx = 0; dy = grid;
  } else if (e.key === "ArrowLeft" && dx === 0) {
    dx = -grid; dy = 0;
  } else if (e.key === "ArrowRight" && dx === 0) {
    dx = grid; dy = 0;
  }
});

// Restart button
document.getElementById("restart").addEventListener("click", initGame);

// Start game
initGame();
</script>

</body>
</html>
